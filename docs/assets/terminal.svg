<svg xmlns="http://www.w3.org/2000/svg" width="680" height="495" viewBox="0 0 680 495" role="img" aria-labelledby="title desc">
<title id="title">SHR PA offline terminal shell</title><desc id="desc">Actual project page text from the executable, typeset as SVG. No live audio or meters.</desc>
<rect width="680" height="495" rx="20" fill="#101922"/>
<g font-family="DejaVu Sans, sans-serif"><text x="36" y="39" font-size="15" fill="#a3b8c6" >SCAFFOLD PREVIEW / 40 × 13</text><rect x="24" y="62" width="630" height="374" rx="10" fill="#0b1118" stroke="#334956"/><text x="39" y="91" font-size="23" fill="#66e1ca" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">SHR PA        HIGHLY EXPERIMENTAL</text><text x="39" y="118" font-size="23" fill="#edf4f7" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">----------------------------------------</text><text x="39" y="145" font-size="23" fill="#edf4f7" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">01 / PROJECT</text><text x="39" y="172" font-size="23" fill="#edf4f7" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">PA management for Raspberry Pi 5</text><text x="39" y="199" font-size="23" fill="#edf4f7" font-family="DejaVu Sans Mono, monospace" xml:space="preserve"></text><text x="39" y="226" font-size="23" fill="#edf4f7" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">First target: DriveRack capabilities</text><text x="39" y="253" font-size="23" fill="#edf4f7" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">Rust / Linux Lite / terminal UI</text><text x="39" y="280" font-size="23" fill="#edf4f7" font-family="DejaVu Sans Mono, monospace" xml:space="preserve"></text><text x="39" y="307" font-size="23" fill="#edf4f7" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">Scaffold only. Audio is not open.</text><text x="39" y="334" font-size="23" fill="#edf4f7" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">Routing and DSP are planned.</text><text x="39" y="361" font-size="23" fill="#edf4f7" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">Channel use will be defined later.</text><text x="39" y="388" font-size="23" fill="#edf4f7" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">----------------------------------------</text><text x="39" y="415" font-size="23" fill="#edf4f7" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">[ PREV ]     [ NEXT ]     [ EXIT ]      </text><text x="36" y="470" font-size="15" fill="#a3b8c6" >Actual --snapshot text. Audio processing is not implemented.</text></g></svg>
