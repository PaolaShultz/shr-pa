<svg xmlns="http://www.w3.org/2000/svg" width="680" height="495" viewBox="0 0 680 495" role="img" aria-labelledby="title desc">
<title id="title">SHR PA offline engine editor</title><desc id="desc">Actual project page text from the executable, typeset as SVG. No live audio or meters.</desc>
<rect width="680" height="495" rx="20" fill="#101922"/>
<g font-family="DejaVu Sans, sans-serif"><text x="36" y="39" font-size="15" fill="#a3b8c6" >OFFLINE EDITOR / 40 × 13</text><rect x="24" y="62" width="630" height="374" rx="10" fill="#0b1118" stroke="#334956"/><text x="39" y="91" font-size="23" fill="#66e1ca" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">SHR PA        HIGHLY EXPERIMENTAL</text><text x="39" y="118" font-size="23" fill="#edf4f7" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">----------------------------------------</text><text x="39" y="145" font-size="23" fill="#edf4f7" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">01 / ENGINE - OFFLINE EDITOR </text><text x="39" y="172" font-size="23" fill="#edf4f7" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">c:ThreeWay i:Stereo</text><text x="39" y="199" font-size="23" fill="#edf4f7" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">b:pair 1 +/-:0.0dB p:inv false</text><text x="39" y="226" font-size="23" fill="#edf4f7" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">d/D:0.0ms e/E:EQ +0dB</text><text x="39" y="253" font-size="23" fill="#edf4f7" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">t/T:limit -1dB o:mono bass false</text><text x="39" y="280" font-size="23" fill="#edf4f7" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">1..6 mute: MMMMMM</text><text x="39" y="307" font-size="23" fill="#edf4f7" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">P:library :command s:save l:load</text><text x="39" y="334" font-size="23" fill="#edf4f7" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">Peak 0.000 0.000 0.000</text><text x="39" y="361" font-size="23" fill="#edf4f7" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">Offline: no device open</text><text x="39" y="388" font-size="23" fill="#edf4f7" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">----------------------------------------</text><text x="39" y="415" font-size="23" fill="#edf4f7" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">[ PREV ]     [ NEXT ]     [ EXIT ]      </text><text x="36" y="470" font-size="15" fill="#a3b8c6" >Actual --snapshot text. Preview uses the working DSP engine.</text></g></svg>
