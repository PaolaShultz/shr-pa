<g font-family="DejaVu Sans, sans-serif"><text x="55" y="59" font-size="15" fill="#66e1ca" >S H R  /  A U D I O  S Y S T E M S</text><text x="50" y="158" font-size="86" fill="#edf4f7" font-weight="bold">SHR PA</text><text x="55" y="212" font-size="25" fill="#edf4f7" >A PA system, built from the signal up.</text><text x="55" y="254" font-size="19" fill="#a3b8c6" >Rust  /  Raspberry Pi 5  /  Terminal</text><rect x="55" y="296" width="244" height="33" rx="16" fill="#433525"/><text x="73" y="318" font-size="15" fill="#ffc47b" >HIGHLY EXPERIMENTAL</text><path d="M 720 76 H 790 C 865 76 865 76 940 76 H 1100" fill="none" stroke="#66e1ca" stroke-width="2" opacity=".7"/><circle cx="720" cy="76" r="6" fill="#66e1ca"/><circle cx="1100" cy="76" r="6" fill="#66e1ca"/><path d="M 720 131 H 790 C 865 131 865 186 940 186 H 1100" fill="none" stroke="#ffc47b" stroke-width="2" opacity=".7"/><circle cx="720" cy="131" r="6" fill="#ffc47b"/><circle cx="1100" cy="186" r="6" fill="#ffc47b"/><path d="M 720 186 H 790 C 865 186 865 296 940 296 H 1100" fill="none" stroke="#66e1ca" stroke-width="2" opacity=".7"/><circle cx="720" cy="186" r="6" fill="#66e1ca"/><circle cx="1100" cy="296" r="6" fill="#66e1ca"/><path d="M 720 241 H 790 C 865 241 865 131 940 131 H 1100" fill="none" stroke="#ffc47b" stroke-width="2" opacity=".7"/><circle cx="720" cy="241" r="6" fill="#ffc47b"/><circle cx="1100" cy="131" r="6" fill="#ffc47b"/><path d="M 720 296 H 790 C 865 296 865 241 940 241 H 1100" fill="none" stroke="#66e1ca" stroke-width="2" opacity=".7"/><circle cx="720" cy="296" r="6" fill="#66e1ca"/><circle cx="1100" cy="241" r="6" fill="#66e1ca"/><text x="718" y="343" font-size="15" fill="#a3b8c6" >ROUTE  /  ALIGN  /  MEASURE</text></g></svg>
