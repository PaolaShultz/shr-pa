<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="630" viewBox="0 0 1120 630" role="img" aria-labelledby="title desc">
<title id="title">Planned SHR PA 2-input 6-output architecture</title><desc id="desc">Stereo program input through EQ, feedback suppression, bass synthesis, compression, pre-delay and crossover. Three output pairs each have EQ, limiter, delay, mutes and meters. A separate setup microphone feeds measurement.</desc>
<rect width="1120" height="630" rx="20" fill="#101922"/>
<g font-family="DejaVu Sans, sans-serif"><text x="40" y="48" font-size="23" fill="#66e1ca" >DRIVERACK FUNCTIONS / 2 INPUTS × 6 OUTPUTS</text><text x="40" y="80" font-size="17" fill="#a3b8c6" >Planned processing · LR24 first · all audio implementation pending</text><rect x="40" y="112" width="240" height="95" rx="12" fill="#192733" stroke="#334956"/><text x="56" y="148" font-size="19" fill="#edf4f7" >INPUT L / R</text><text x="56" y="181" font-size="17" fill="#a3b8c6" >Program or test signal</text><path d="M 280 158 h 33 m -7 -5 l 7 5 l -7 5" stroke="#66e1ca" stroke-width="2" fill="none"/><rect x="315" y="112" width="360" height="95" rx="12" fill="#192733" stroke="#334956"/><text x="331" y="148" font-size="19" fill="#edf4f7" >INPUT PROCESSING</text><text x="331" y="181" font-size="17" fill="#a3b8c6" >GEQ → room EQ → feedback</text><path d="M 675 158 h 33 m -7 -5 l 7 5 l -7 5" stroke="#66e1ca" stroke-width="2" fill="none"/><rect x="710" y="112" width="360" height="95" rx="12" fill="#192733" stroke="#334956"/><text x="726" y="148" font-size="19" fill="#edf4f7" >DYNAMICS + DELAY</text><text x="726" y="181" font-size="17" fill="#a3b8c6" >Bass synth → comp → pre-delay</text><path d="M 890 207 V 235 H 150 V 315" stroke="#66e1ca" stroke-width="2" fill="none"/><rect x="40" y="315" width="220" height="98" rx="12" fill="#192733"/><text x="59" y="354" font-size="22" fill="#edf4f7" >CROSSOVER</text><text x="59" y="385" font-size="17" fill="#a3b8c6" >Band gain + polarity</text><path d="M 260 364 H 292 V 299 H 325" stroke="#66e1ca" stroke-width="2" fill="none"/><rect x="325" y="270" width="745" height="58" rx="10" fill="#192733"/><text x="342" y="306" font-size="20" fill="#66e1ca" >HIGH L/R</text><text x="478" y="306" font-size="20" fill="#edf4f7" >PEQ → limiter → delay → mutes → meters</text><path d="M 260 364 H 292 V 374 H 325" stroke="#66e1ca" stroke-width="2" fill="none"/><rect x="325" y="345" width="745" height="58" rx="10" fill="#192733"/><text x="342" y="381" font-size="20" fill="#66e1ca" >MID L/R</text><text x="478" y="381" font-size="20" fill="#edf4f7" >PEQ → limiter → delay → mutes → meters</text><path d="M 260 364 H 292 V 449 H 325" stroke="#66e1ca" stroke-width="2" fill="none"/><rect x="325" y="420" width="745" height="58" rx="10" fill="#192733"/><text x="342" y="456" font-size="20" fill="#66e1ca" >LOW L/R</text><text x="478" y="456" font-size="20" fill="#edf4f7" >PEQ → limiter → delay → mutes → meters</text><text x="40" y="525" font-size="19" fill="#ffc47b" >SETUP MIC → RTA / LEVEL ASSIST / AUTOEQ</text><text x="40" y="556" font-size="17" fill="#a3b8c6" >One microphone; ordinary sequential measurements. Eight-point positional RTA is future work.</text><text x="40" y="600" font-size="17" fill="#a3b8c6" >Control and analysis run outside the synchronous audio path.</text></g></svg>
