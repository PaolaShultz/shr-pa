<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="630" viewBox="0 0 1140 630" role="img" aria-labelledby="title desc">
<title id="title">SHR PA implemented 2-input 6-output signal path</title><desc id="desc">Input meters, source mode, gain, GEQ, input PEQ, compressor, delay and crossover feed three stereo output pairs. Each pair has gain, polarity, PEQ, limiter, delay, ceiling guard, mutes and meters. Feedback, synthesis and microphone analysis are labelled planned.</desc>
<rect width="1140" height="630" rx="20" fill="#101922"/>
<g font-family="DejaVu Sans, sans-serif"><text x="40" y="48" font-size="23" fill="#66e1ca" >IMPLEMENTED / 2 INPUTS × 6 LOGICAL OUTPUTS</text><text x="40" y="80" font-size="17" fill="#a3b8c6" >Capture, stereo WAV or explicit generator → meters → stereo/mono-left → input gain</text><rect x="40" y="112" width="330" height="95" rx="12" fill="#192733" stroke="#334956"/><text x="56" y="148" font-size="19" fill="#edf4f7" >INPUT EQ</text><text x="56" y="181" font-size="16" fill="#a3b8c6" >31-band GEQ → 8 PEQs/channel</text><path d="M 370 158 h 33 m -7 -5 l 7 5 l -7 5" stroke="#66e1ca" stroke-width="2" fill="none"/><rect x="405" y="112" width="330" height="95" rx="12" fill="#192733" stroke="#334956"/><text x="421" y="148" font-size="19" fill="#edf4f7" >DYNAMICS</text><text x="421" y="181" font-size="16" fill="#a3b8c6" >Linked compressor → input delay</text><path d="M 735 158 h 33 m -7 -5 l 7 5 l -7 5" stroke="#66e1ca" stroke-width="2" fill="none"/><rect x="770" y="112" width="330" height="95" rx="12" fill="#192733" stroke="#334956"/><text x="786" y="148" font-size="19" fill="#edf4f7" >CROSSOVER</text><text x="786" y="181" font-size="16" fill="#a3b8c6" >Layout LR24 or pair HP → LP</text><path d="M 935 207 V 227 H 60 V 415" stroke="#66e1ca" stroke-width="2" fill="none"/><path d="M 60 269 H 85" stroke="#66e1ca" stroke-width="2"/><rect x="85" y="240" width="1015" height="58" rx="10" fill="#192733"/><text x="102" y="276" font-size="20" fill="#66e1ca" >HIGH 0/1</text><text x="238" y="276" font-size="19" fill="#edf4f7" >Gain/polarity → PEQ → limiter → delay → ceiling guard → mute → meter</text><path d="M 60 344 H 85" stroke="#66e1ca" stroke-width="2"/><rect x="85" y="315" width="1015" height="58" rx="10" fill="#192733"/><text x="102" y="351" font-size="20" fill="#66e1ca" >MID 2/3</text><text x="238" y="351" font-size="19" fill="#edf4f7" >Gain/polarity → PEQ → limiter → delay → ceiling guard → mute → meter</text><path d="M 60 419 H 85" stroke="#66e1ca" stroke-width="2"/><rect x="85" y="390" width="1015" height="58" rx="10" fill="#192733"/><text x="102" y="426" font-size="20" fill="#66e1ca" >LOW 4/5</text><text x="238" y="426" font-size="19" fill="#edf4f7" >Gain/polarity → PEQ → limiter → delay → ceiling guard → mute → meter</text><text x="40" y="485" font-size="19" fill="#edf4f7" >Six-channel WAV or explicit physical map; unmapped logical outputs still process.</text><text x="40" y="525" font-size="18" fill="#ffc47b" >PLANNED: feedback notches / subharmonic synthesis / setup mic / RTA / AutoEQ</text><text x="40" y="558" font-size="17" fill="#a3b8c6" >One separate setup mic is planned. Eight-point positional RTA remains future scope.</text><text x="40" y="600" font-size="17" fill="#a3b8c6" >Controller prepares edits; bounded DSP applies them. Storage and UI stay outside render.</text></g></svg>
