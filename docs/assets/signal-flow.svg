<svg xmlns="http://www.w3.org/2000/svg" width="990" height="440" viewBox="0 0 990 440" role="img" aria-labelledby="title desc">
<title id="title">Planned SHR PA processing architecture</title><desc id="desc">ALSA capture, synchronous DSP graph and output processing, then ALSA playback. Separate analysis and terminal control work.</desc>
<rect width="990" height="440" rx="20" fill="#101922"/>
<g font-family="DejaVu Sans, sans-serif"><text x="40" y="48" font-size="21" fill="#66e1ca" >ONE SYNCHRONOUS AUDIO PATH</text><text x="40" y="78" font-size="16" fill="#a3b8c6" >Planned architecture · processing and channel roles remain to be implemented</text><rect x="40" y="115" width="205" height="98" rx="12" fill="#192733" stroke="#334956"/><text x="58" y="153" font-size="21" fill="#edf4f7" >USB / ALSA</text><text x="58" y="184" font-size="16" fill="#a3b8c6" >Capture</text><path d="M 247 164 h 23 m -7 -5 l 7 5 l -7 5" stroke="#66e1ca" stroke-width="2" fill="none"/><rect x="275" y="115" width="205" height="98" rx="12" fill="#192733" stroke="#334956"/><text x="293" y="153" font-size="21" fill="#edf4f7" >DSP graph</text><text x="293" y="184" font-size="16" fill="#a3b8c6" >Routing + LR24 + EQ</text><path d="M 482 164 h 23 m -7 -5 l 7 5 l -7 5" stroke="#66e1ca" stroke-width="2" fill="none"/><rect x="510" y="115" width="205" height="98" rx="12" fill="#192733" stroke="#334956"/><text x="528" y="153" font-size="21" fill="#edf4f7" >Output stages</text><text x="528" y="184" font-size="16" fill="#a3b8c6" >Delay + limiting</text><path d="M 717 164 h 23 m -7 -5 l 7 5 l -7 5" stroke="#66e1ca" stroke-width="2" fill="none"/><rect x="745" y="115" width="205" height="98" rx="12" fill="#192733" stroke="#334956"/><text x="763" y="153" font-size="21" fill="#edf4f7" >USB / ALSA</text><text x="763" y="184" font-size="16" fill="#a3b8c6" >Playback</text><path d="M 377 213 V 253 H 242 V 277 M 377 253 H 675 V 277" stroke="#66e1ca" stroke-width="2" fill="none" stroke-dasharray="5 5"/><rect x="40" y="277" width="445" height="90" rx="12" fill="#192733"/><text x="60" y="312" font-size="21" fill="#edf4f7" >Measurement workers</text><text x="60" y="343" font-size="17" fill="#a3b8c6" >RTA / EQ fitting / feedback detection</text><rect x="505" y="277" width="445" height="90" rx="12" fill="#192733"/><text x="525" y="312" font-size="21" fill="#edf4f7" >Control + terminal UI</text><text x="525" y="343" font-size="17" fill="#a3b8c6" >Prepared edits / status / optional MIDI</text><text x="40" y="408" font-size="18" fill="#a3b8c6" >Analysis and control work stay outside the audio deadline.</text></g></svg>
